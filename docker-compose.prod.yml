# Production Docker Compose Configuration for TaskMaster UI
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  # PostgreSQL Database (Production Configuration)
  postgres:
    environment:
      POSTGRES_DB: taskmaster_prod
      POSTGRES_USER: taskmaster
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_HOST_AUTH_METHOD: md5
    secrets:
      - db_password
      - source: ssl_ca_cert
        target: ssl_ca_cert.pem
        mode: 0444
      - source: ssl_server_cert
        target: ssl_server_cert.pem
        mode: 0444
      - source: ssl_server_key
        target: ssl_server_key.pem
        mode: 0400
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./database/backup:/backup:ro
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c ssl=on
      -c ssl_ca_file=/run/secrets/ssl_ca_cert.pem
      -c ssl_cert_file=/run/secrets/ssl_server_cert.pem
      -c ssl_key_file=/run/secrets/ssl_server_key.pem
      -c ssl_ciphers='HIGH:MEDIUM:+3DES:!aNULL'
      -c ssl_prefer_server_ciphers=on
    restart: always

  # Backend API Service (Production)
  backend:
    build:
      target: production
    environment:
      - NODE_ENV=production
      - PORT=3001
      - ENABLE_QUERY_ANALYSIS=false
      - SEED_DATABASE=false
      - DOCKER_SECRETS=true
      - SECRETS_PROVIDER=file
    secrets:
      - db_password
      - jwt_secret
      - encryption_key
      - source: github_token
        target: github_token
        mode: 0400
      - source: slack_bot_token
        target: slack_bot_token
        mode: 0400
      - source: anthropic_api_key
        target: anthropic_api_key
        mode: 0400
      - source: ssl_ca_cert
        target: ssl_ca_cert.pem
        mode: 0444
      - source: ssl_client_cert
        target: ssl_client_cert.pem
        mode: 0444
      - source: ssl_client_key
        target: ssl_client_key.pem
        mode: 0400
    ports: []  # Remove direct port access in production
    volumes:
      - backend_prod_logs:/app/logs
      - ./packages/backend/performance-reports:/app/performance-reports
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    restart: always

  # Frontend Web Application (Production)
  frontend:
    build:
      target: production
    environment:
      - VITE_API_URL=/api
      - VITE_WS_URL=/ws
      - VITE_NODE_ENV=production
    ports: []  # Remove direct port access in production
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
    restart: always

  # Nginx Reverse Proxy (Always enabled in production)
  nginx:
    profiles: []  # Remove profiles to always run
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
    restart: always

  # Redis Cache (Optional for production)
  redis:
    image: redis:7-alpine
    container_name: taskmaster-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - taskmaster-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    restart: always
    profiles:
      - cache

  # Monitoring with Prometheus (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: taskmaster-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - taskmaster-network
    restart: always
    profiles:
      - monitoring

  # Grafana Dashboard (Optional)
  grafana:
    image: grafana/grafana:latest
    container_name: taskmaster-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana_password
      - GF_USERS_ALLOW_SIGN_UP=false
    secrets:
      - grafana_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - taskmaster-network
    restart: always
    profiles:
      - monitoring

volumes:
  postgres_prod_data:
    driver: local
  backend_prod_logs:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

secrets:
  # Database secrets
  db_password:
    file: ./secrets/db_password.txt
  
  # Application security secrets
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  encryption_key:
    file: ./secrets/encryption_key.txt
  
  # External service API keys
  github_token:
    file: ./secrets/github_token.txt
  slack_bot_token:
    file: ./secrets/slack_bot_token.txt
  anthropic_api_key:
    file: ./secrets/anthropic_api_key.txt
  
  # Monitoring secrets
  grafana_password:
    file: ./secrets/grafana_password.txt
  
  # SSL certificates
  ssl_ca_cert:
    file: ./secrets/ssl_ca_cert.pem
  ssl_client_cert:
    file: ./secrets/ssl_client_cert.pem
  ssl_client_key:
    file: ./secrets/ssl_client_key.pem
  ssl_server_cert:
    file: ./ssl-certs/server-cert.pem
  ssl_server_key:
    file: ./ssl-certs/server-key.pem