# Production Docker Compose Configuration for TaskMaster UI
# Use with: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  # PostgreSQL Database (Production Configuration)
  postgres:
    environment:
      POSTGRES_DB: taskmaster_prod
      POSTGRES_USER: taskmaster
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_production_password}
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./database/backup:/backup:ro
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=100
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
    restart: always

  # Backend API Service (Production)
  backend:
    build:
      target: production
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://taskmaster:${DB_PASSWORD:-secure_production_password}@postgres:5432/taskmaster_prod
      - PORT=3001
      - ENABLE_QUERY_ANALYSIS=false
      - SEED_DATABASE=false
    ports: []  # Remove direct port access in production
    volumes:
      - backend_prod_logs:/app/logs
      - ./packages/backend/performance-reports:/app/performance-reports
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    restart: always

  # Frontend Web Application (Production)
  frontend:
    build:
      target: production
    environment:
      - VITE_API_URL=/api
      - VITE_WS_URL=/ws
      - VITE_NODE_ENV=production
    ports: []  # Remove direct port access in production
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
    restart: always

  # Nginx Reverse Proxy (Always enabled in production)
  nginx:
    profiles: []  # Remove profiles to always run
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
    restart: always

  # Redis Cache (Optional for production)
  redis:
    image: redis:7-alpine
    container_name: taskmaster-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - taskmaster-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    restart: always
    profiles:
      - cache

  # Monitoring with Prometheus (Optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: taskmaster-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - taskmaster-network
    restart: always
    profiles:
      - monitoring

  # Grafana Dashboard (Optional)
  grafana:
    image: grafana/grafana:latest
    container_name: taskmaster-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - taskmaster-network
    restart: always
    profiles:
      - monitoring

volumes:
  postgres_prod_data:
    driver: local
  backend_prod_logs:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local