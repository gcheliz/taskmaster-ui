name: CI Performance Enhancement

# This workflow enhances CI performance with advanced caching strategies

on:
  workflow_call:
    secrets:
      TURBO_TOKEN:
        required: false
      TURBO_TEAM:
        required: false

jobs:
  setup-cache:
    name: Setup Build Cache
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '8'

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup build cache
        id: cache
        uses: actions/cache@v3
        with:
          path: |
            packages/*/dist
            packages/*/.turbo
            .turbo
            packages/frontend/.vite
            packages/backend/prisma/client
            node_modules/.cache
          key: ${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Setup Turborepo Remote Cache
        if: env.TURBO_TOKEN != ''
        run: |
          echo "TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}" >> $GITHUB_ENV
          echo "TURBO_TEAM=${{ secrets.TURBO_TEAM }}" >> $GITHUB_ENV

  docker-layer-cache:
    name: Docker Layer Caching
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Configure Buildx
        run: |
          docker buildx create --use --driver-opt env.BUILDKIT_STEP_LOG_MAX_SIZE=10485760

  playwright-browser-cache:
    name: Playwright Browser Cache
    runs-on: ubuntu-latest
    steps:
      - name: Get Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(pnpm list @playwright/test --json | jq -r '.[0].dependencies["@playwright/test"].version')
          echo "version=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

  test-results-cache:
    name: Test Results Cache
    runs-on: ubuntu-latest
    steps:
      - name: Cache test results
        uses: actions/cache@v3
        with:
          path: |
            coverage/
            .nyc_output/
            test-results/
            playwright-report/
          key: ${{ runner.os }}-test-results-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-test-results-

  dependency-review-cache:
    name: Dependency Review Cache
    runs-on: ubuntu-latest
    steps:
      - name: Cache dependency review results
        uses: actions/cache@v3
        with:
          path: |
            .dependency-review/
            audit-results/
          key: ${{ runner.os }}-deps-review-${{ hashFiles('**/pnpm-lock.yaml') }}

  # Composite action for reusable caching
  restore-all-caches:
    name: Restore All Caches
    runs-on: ubuntu-latest
    needs: [setup-cache, docker-layer-cache, playwright-browser-cache]
    steps:
      - name: Summary of cache restoration
        run: |
          echo "### Cache Restoration Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- pnpm store: ${{ needs.setup-cache.outputs.cache-hit == 'true' && '✅ Hit' || '❌ Miss' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build artifacts: Restored" >> $GITHUB_STEP_SUMMARY
          echo "- Docker layers: Available" >> $GITHUB_STEP_SUMMARY
          echo "- Playwright browsers: Cached" >> $GITHUB_STEP_SUMMARY