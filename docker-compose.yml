services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: taskmaster-postgres
    environment:
      POSTGRES_DB: taskmaster_dev
      POSTGRES_USER: taskmaster
      POSTGRES_PASSWORD: password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmaster -d taskmaster_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - taskmaster-network

  # Backend API Service
  backend:
    container_name: taskmaster-backend
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
      target: development
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://taskmaster:password@postgres:5432/taskmaster_dev
      - PORT=3001
      - PRISMA_STUDIO_PORT=5555
      - ENABLE_QUERY_ANALYSIS=true
      - SEED_DATABASE=false
    ports:
      - "3001:3001"
      - "5555:5555"  # Prisma Studio
    volumes:
      - ./packages/backend/src:/app/packages/backend/src:ro
      - ./packages/backend/prisma:/app/packages/backend/prisma:ro
      - ./packages/backend/package.json:/app/packages/backend/package.json:ro
      - ./packages/backend/tsconfig.json:/app/packages/backend/tsconfig.json:ro
      - ./packages/backend/nodemon.json:/app/packages/backend/nodemon.json:ro
      - ./packages/backend/scripts:/app/packages/backend/scripts:ro
      - backend_node_modules:/app/packages/backend/node_modules
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - taskmaster-network
    develop:
      watch:
        - action: sync
          path: ./packages/backend/src
          target: /app/packages/backend/src
          ignore:
            - "**/*.test.ts"
            - "**/*.spec.ts"
        - action: sync
          path: ./packages/backend/prisma
          target: /app/packages/backend/prisma
        - action: rebuild
          path: ./packages/backend/package.json
        - action: rebuild
          path: ./packages/backend/Dockerfile

  # Frontend Web Application
  frontend:
    container_name: taskmaster-frontend
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile.fixed
      target: development
    environment:
      - VITE_API_URL=http://localhost:3001
      - VITE_WS_URL=ws://localhost:3001
      - VITE_NODE_ENV=development
      - DOCKER_ENV=true
    ports:
      - "5173:5173"
    volumes:
      - ./packages/frontend/src:/app/packages/frontend/src:cached
      - ./packages/frontend/public:/app/packages/frontend/public:cached
      - ./packages/frontend/index.html:/app/packages/frontend/index.html:cached
      - ./packages/frontend/vite.config.ts:/app/packages/frontend/vite.config.ts:cached
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - taskmaster-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5173 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Storybook Development Server
  storybook:
    container_name: taskmaster-storybook
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      target: development
    environment:
      - NODE_ENV=development
      - DOCKER_ENV=true
    ports:
      - "6006:6006"
    volumes:
      - ./packages/frontend/src:/app/packages/frontend/src:ro
      - ./packages/frontend/public:/app/packages/frontend/public:ro
      - ./packages/frontend/.storybook:/app/packages/frontend/.storybook:ro
      - ./packages/frontend/package.json:/app/packages/frontend/package.json:ro
      - ./packages/frontend/vite.config.ts:/app/packages/frontend/vite.config.ts:ro
      - ./packages/frontend/tsconfig.json:/app/packages/frontend/tsconfig.json:ro
      - ./packages/frontend/tsconfig.app.json:/app/packages/frontend/tsconfig.app.json:ro
      - ./packages/frontend/tsconfig.node.json:/app/packages/frontend/tsconfig.node.json:ro
      - ./packages/frontend/index.html:/app/packages/frontend/index.html:ro
      - ./package.json:/app/package.json:ro
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - frontend_node_modules:/app/packages/frontend/node_modules
    working_dir: /app/packages/frontend
    command: pnpm storybook --host 0.0.0.0 --port 6006 --ci
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const req = http.request('http://localhost:6006', (res) => process.exit(0)); req.on('error', () => process.exit(1)); req.end();\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - taskmaster-network
    develop:
      watch:
        - action: sync
          path: ./packages/frontend/src
          target: /app/packages/frontend/src
        - action: sync
          path: ./packages/frontend/.storybook
          target: /app/packages/frontend/.storybook
        - action: rebuild
          path: ./packages/frontend/package.json
    profiles:
      - development
      - storybook

  # Nginx Reverse Proxy (Production-like setup)
  nginx:
    image: nginx:alpine
    container_name: taskmaster-nginx
    ports:
      - "80:80"
      - "443:443"  # For future SSL support
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - taskmaster-network
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    profiles:
      - production

volumes:
  postgres_data:
    driver: local
  backend_node_modules:
    driver: local
  frontend_node_modules:
    driver: local
  nginx_cache:
    driver: local
  nginx_logs:
    driver: local
  backend_logs:
    driver: local

networks:
  taskmaster-network:
    driver: bridge
    name: taskmaster-network