name: Maintenance & Dependencies

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  # Dependency Updates
  dependency-update:
    name: Update Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update dependencies
        run: |
          pnpm update --latest --recursive
          pnpm install

      - name: Run tests after update
        run: |
          pnpm run build
          pnpm run lint
          pnpm --filter=frontend run test --run
        continue-on-error: true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies'
          title: 'chore: automated dependency updates'
          body: |
            ## Automated Dependency Updates

            This PR contains automated updates to project dependencies.

            ### Changes
            - Updated all dependencies to their latest compatible versions
            - Regenerated lockfiles
            - Tests passing: ${{ steps.test.outcome == 'success' }}

            ### Verification
            - [ ] All tests pass
            - [ ] Build succeeds
            - [ ] No breaking changes detected

            > Created by GitHub Actions
          branch: chore/dependency-updates
          delete-branch: true

  # Bundle Analysis
  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Analyze bundle size
        run: |
          echo "## Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend Bundle" >> $GITHUB_STEP_SUMMARY
          
          # Get bundle sizes
          find packages/frontend/dist -name "*.js" -exec basename {} \; -exec stat -f%z {} \; | 
          paste - - | 
          awk '{printf "- %s: %.2f KB\n", $1, $2/1024}' >> $GITHUB_STEP_SUMMARY

      - name: Check bundle size limits
        run: |
          # Check if main bundle exceeds 500KB
          MAIN_BUNDLE_SIZE=$(find packages/frontend/dist -name "index-*.js" -exec stat -f%z {} \;)
          if [ "$MAIN_BUNDLE_SIZE" -gt 512000 ]; then
            echo "⚠️ Main bundle size exceeds 500KB limit: $(echo "$MAIN_BUNDLE_SIZE / 1024" | bc)KB"
            exit 1
          else
            echo "✅ Bundle size within limits: $(echo "$MAIN_BUNDLE_SIZE / 1024" | bc)KB"
          fi

  # Security Monitoring
  security-monitoring:
    name: Security Monitoring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Check for high severity vulnerabilities
        run: |
          HIGH_VULNS=$(pnpm audit --audit-level high --json | jq '.metadata.vulnerabilities.high // 0')
          if [ "$HIGH_VULNS" -gt 0 ]; then
            echo "⚠️ Found $HIGH_VULNS high severity vulnerabilities"
            echo "Please review and update affected packages"
            exit 1
          else
            echo "✅ No high severity vulnerabilities found"
          fi

  # Performance Monitoring
  lighthouse-audit:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Serve application
        run: |
          pnpm exec http-server packages/frontend/dist -p 8080 &
          sleep 5

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.12.0
          lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 30

  # Code Quality Metrics
  code-quality-metrics:
    name: Code Quality Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for SonarCloud

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: |
          pnpm --filter=frontend run test --coverage
          pnpm --filter=backend run test --coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Cleanup Old Artifacts
  cleanup-artifacts:
    name: Cleanup Old Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
          age: '1 month'
          skip-tags: true
          skip-recent: 10