<!DOCTYPE html>
<html>
<head>
    <title>TaskMaster UI Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .status { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>TaskMaster UI Connection Test</h1>
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = message;
            results.appendChild(div);
        }
        
        // Test Frontend
        fetch('http://localhost:5173')
            .then(res => {
                addResult(`Frontend: ${res.status} ${res.statusText}`, res.ok ? 'success' : 'error');
                return res.text();
            })
            .then(html => {
                if (html.includes('root')) {
                    addResult('Frontend HTML contains root element ✓', 'success');
                }
                if (html.includes('main.tsx')) {
                    addResult('Frontend HTML loads main.tsx ✓', 'success');
                }
            })
            .catch(err => addResult(`Frontend Error: ${err.message}`, 'error'));
        
        // Test Backend
        fetch('http://localhost:3001/health')
            .then(res => res.json())
            .then(data => {
                addResult(`Backend: ${data.status} - ${data.service}`, 'success');
            })
            .catch(err => addResult(`Backend Error: ${err.message}`, 'error'));
        
        // Test Frontend JavaScript
        fetch('http://localhost:5173/src/main.tsx')
            .then(res => {
                addResult(`Frontend JS: ${res.status} ${res.statusText}`, res.ok ? 'success' : 'error');
                return res.text();
            })
            .then(js => {
                if (js.includes('createRoot')) {
                    addResult('Frontend JS loads React app ✓', 'success');
                }
            })
            .catch(err => addResult(`Frontend JS Error: ${err.message}`, 'error'));
    </script>
</body>
</html>
