name: Release Management

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '8'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm exec semantic-release

  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    needs: release
    if: success()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: heinrichreimer/github-changelog-generator-action@v2.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output: CHANGELOG.md
          issues: true
          issuesWoLabels: true
          pullRequests: true
          prWoLabels: true
          unreleased: true
          compareLink: true
          author: true
          usernamesAsGithubLogins: true
          excludeLabels: duplicate,question,invalid,wontfix,skip-changelog
          breakingLabels: breaking-change,breaking
          enhancementLabels: enhancement,feat,feature
          bugsLabels: bug,fix,bugfix
          deprecatedLabels: deprecated,deprecation
          removedLabels: removed

      - name: Commit changelog
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update CHANGELOG.md [skip ci]"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

  create-release-pr:
    name: Create Release PR
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '8'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release branch
        run: |
          RELEASE_BRANCH="release-$(date +%Y%m%d-%H%M%S)"
          git checkout -b $RELEASE_BRANCH
          echo "RELEASE_BRANCH=$RELEASE_BRANCH" >> $GITHUB_ENV

      - name: Update versions
        run: |
          # Update root package.json
          pnpm version patch --no-git-tag-version
          
          # Update workspace packages
          pnpm -r version patch --no-git-tag-version

      - name: Generate release notes
        run: |
          # Get the last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          # Generate release notes
          if [ -z "$LAST_TAG" ]; then
            git log --pretty=format:"- %s" > RELEASE_NOTES.md
          else
            git log $LAST_TAG..HEAD --pretty=format:"- %s" > RELEASE_NOTES.md
          fi

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "chore: prepare release"

      - name: Push release branch
        run: |
          git push origin $RELEASE_BRANCH

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.RELEASE_BRANCH }}
          title: "chore: prepare release"
          body: |
            ## Release Preparation
            
            This PR prepares the next release with updated versions and changelog.
            
            ### Release Notes
            
            See RELEASE_NOTES.md for changes included in this release.
            
            ### Checklist
            - [ ] Review version bumps
            - [ ] Review changelog entries
            - [ ] Run final tests
            - [ ] Approve and merge
          labels: release,automated