# Security Configuration for TaskMaster UI

# Security Headers
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content Security Policy
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;

# Hide server information
server_tokens off;
more_clear_headers Server;

# Limit request methods
if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$ ) {
    return 405;
}

# Block common attack patterns
location ~* (\.php|\.asp|\.aspx|\.jsp)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# Block SQL injection attempts
if ($args ~* "(\<|%3C).*script.*(\>|%3E)") { return 403; }
if ($args ~* "GLOBALS(=|\[|\%[0-9A-Z]{0,2})") { return 403; }
if ($args ~* "_REQUEST(=|\[|\%[0-9A-Z]{0,2})") { return 403; }
if ($args ~* "proc/self/environ") { return 403; }
if ($args ~* "mosConfig_[a-zA-Z_]{1,21}(=|\%3D)") { return 403; }
if ($args ~* "base64_(en|de)code\(.*\)") { return 403; }

# Block file injection attempts
if ($query_string ~* "[a-zA-Z0-9_]=http://") { return 403; }
if ($query_string ~* "[a-zA-Z0-9_]=(\.\.//?)+") { return 403; }
if ($query_string ~* "[a-zA-Z0-9_]=/([a-z0-9_.]//?)+") { return 403; }