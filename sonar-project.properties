# SonarCloud Configuration for TaskMaster UI
# Documentation: https://docs.sonarcloud.io/advanced-setup/analysis-parameters/

sonar.projectKey=taskmaster-ui
sonar.organization=taskmaster-ui

# Basic project information
sonar.projectName=TaskMaster UI
sonar.projectVersion=1.0.0

# Source code settings
sonar.sources=packages/frontend/src,packages/backend/src
sonar.tests=packages/frontend/src,packages/backend/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Coverage reports
sonar.javascript.lcov.reportPaths=packages/frontend/coverage/lcov.info,packages/backend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=packages/frontend/coverage/lcov.info,packages/backend/coverage/lcov.info

# Exclusions
sonar.exclusions=**/*.stories.*,**/storybook-static/**,**/dist/**,**/build/**,**/coverage/**,**/node_modules/**,**/*.config.js,**/*.config.ts,**/generated/**

# Test exclusions
sonar.test.exclusions=**/*.stories.*,**/storybook-static/**,**/dist/**,**/build/**

# Language-specific settings
sonar.typescript.node.maxspace=4096

# Security hotspots
sonar.security.hotspots.ignored=false

# Quality gate
sonar.qualitygate.wait=true

# Scanner behavior
sonar.scanner.force-deprecated-java-version=false